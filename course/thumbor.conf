# thumbor configuration for CSE 490 Project 6.
#
# Start the course server from the repository root with:
#
#     python -m thumbor.server -p 8888 -c course/thumbor.conf -l error
#
# The server then serves the pictures in course/images. For example:
#
#     http://127.0.0.1:8888/unsafe/fit-in/300x300/filters:fill(red):no_upscale():format(png)/small.png
#
# This file is Python. thumbor runs it with exec, so __file__ is not always
# defined. The images folder is found next to this file in every case:
# from __file__ when it exists, else from the -c argument given to the
# server, else from the course folder under the current directory.

import os
import sys


def _course_dir():
    if "__file__" in globals():
        return os.path.dirname(os.path.abspath(__file__))
    args = sys.argv
    for index, arg in enumerate(args):
        if arg in ("-c", "--conf") and index + 1 < len(args):
            return os.path.dirname(os.path.abspath(args[index + 1]))
        if arg.startswith("--conf="):
            return os.path.dirname(os.path.abspath(arg.split("=", 1)[1]))
    return os.path.join(os.getcwd(), "course")


LOADER = "thumbor.loaders.file_loader"
FILE_LOADER_ROOT_PATH = os.path.join(_course_dir(), "images")
ALLOW_UNSAFE_URL = True
STORAGE = "thumbor.storages.no_storage"
